<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GPS-less Visual SLAM 3-Mode Ortho Map (v2026.11.12-1803)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js for 3D Spatial Rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      background-color: #030712;
      color: #f3f4f6;
      overflow: hidden;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .glass-card {
      background: rgba(30, 41, 59, 0.74);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-button {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .glass-button:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.22);
    }

    .pip-container {
      width: 104px;
      height: 142px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85), 0 0 0 2px rgba(56, 189, 248, 0.7);
      transition: transform 0.2s ease;
    }
    .pip-container:active {
      transform: scale(0.95);
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.75; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.75; }
    }
    .status-pulse {
      animation: pulse-ring 1.8s infinite ease-in-out;
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden flex flex-col bg-slate-950 text-slate-100 select-none">

  <!-- TOP HEADER: STATUS, PERSISTENT BUILD VERSION & 3-MODE SEGMENTED SWITCHER -->
  <header class="absolute top-0 left-0 right-0 z-40 pt-10 pb-2.5 px-3.5 glass-panel border-b-0 rounded-b-3xl flex flex-col space-y-2 shadow-2xl">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2 min-w-0">
        <div id="status-indicator" class="w-2.5 h-2.5 rounded-full bg-amber-500 status-pulse shrink-0"></div>
        <span class="text-[11px] font-bold tracking-wider uppercase text-sky-400 truncate">Visual SLAM Map</span>
        <span id="app-build-ver" class="px-1.5 py-0.5 rounded text-[9px] font-mono font-bold bg-cyan-950 text-cyan-300 border border-cyan-400/50 shrink-0">
          v2026.11.12-1803
        </span>
      </div>
      <div id="status-text" class="text-[11px] font-bold text-slate-200 truncate max-w-[165px] text-right">
        カメラ待機中...
      </div>
    </div>

    <!-- 3-Mode Segmented Switcher: カメラ / 3Dマップ / 2Dマップ -->
    <div class="grid grid-cols-3 bg-slate-900/95 p-1 rounded-2xl border border-white/15 gap-1">
      <button id="seg-btn-camera" class="py-1.5 px-2 rounded-xl text-xs font-bold bg-sky-500 text-white shadow transition-all flex items-center justify-center gap-1">
        <i class="fa-solid fa-camera text-[11px]"></i>
        <span>カメラ</span>
      </button>
      <button id="seg-btn-3d" class="py-1.5 px-2 rounded-xl text-xs font-bold text-slate-300 hover:text-white transition-all flex items-center justify-center gap-1">
        <i class="fa-solid fa-cube text-[11px]"></i>
        <span>3Dマップ</span>
      </button>
      <button id="seg-btn-2d" class="py-1.5 px-2 rounded-xl text-xs font-bold text-slate-300 hover:text-white transition-all flex items-center justify-center gap-1">
        <i class="fa-solid fa-map text-[11px]"></i>
        <span>2Dマップ</span>
      </button>
    </div>
  </header>

  <!-- MAIN VIEWPORTS CONTAINER -->
  <main id="viewport-root" class="relative w-full h-full flex-1 overflow-hidden">

    <!-- 1. CAMERA VIEWPORT + COLOR-EDGE FEATURE POINTS OVERLAY -->
    <div id="camera-viewport" class="absolute inset-0 w-full h-full z-10 opacity-100 pointer-events-auto transition-opacity duration-300">
      <video id="camera-feed" playsinline webkit-playsinline autoplay muted class="absolute inset-0 w-full h-full object-cover"></video>
      <!-- Color-Edge Shi-Tomasi Keypoints, Trails & PnP Reprojection Overlay -->
      <canvas id="tracking-canvas" class="absolute inset-0 w-full h-full z-20 pointer-events-none"></canvas>

      <!-- Active Color-Edge Telemetry Pill -->
      <div class="absolute top-32 left-3.5 z-30 pointer-events-none flex flex-col space-y-1.5">
        <div class="px-3 py-1 rounded-full text-[10px] font-mono bg-black/75 backdrop-blur-md border border-emerald-400/40 text-emerald-200 w-max flex items-center gap-1.5 shadow-lg">
          <i class="fa-solid fa-crosshairs text-emerald-400"></i>
          <span>色エッジ特徴点: <strong id="cam-stat-features" class="text-white">0</strong> (3D確定: <strong id="cam-stat-3d" class="text-emerald-300">0</strong>)</span>
        </div>
        <div class="px-3 py-1 rounded-full text-[10px] font-mono bg-black/75 backdrop-blur-md border border-sky-400/40 text-sky-200 w-max flex items-center gap-1.5 shadow-lg">
          <i class="fa-solid fa-images text-sky-400"></i>
          <span>オルソ用キーフレーム: <strong id="cam-stat-kf" class="text-white">0</strong> 枚</span>
        </div>
        <div class="flex items-center space-x-2 text-[9px] bg-black/70 px-2.5 py-1 rounded-full border border-white/10 w-max text-slate-200">
          <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span>3D確定点</span>
          <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-cyan-400 inline-block"></span>色エッジ点</span>
          <span class="flex items-center gap-1"><span class="w-2 h-0.5 bg-amber-400 inline-block"></span>再投影誤差</span>
        </div>
      </div>

      <!-- Subtle Optical Center Guide -->
      <div class="absolute inset-0 pointer-events-none flex items-center justify-center z-15">
        <div class="w-12 h-12 rounded-full border border-white/25 flex items-center justify-center">
          <div class="w-1.5 h-1.5 rounded-full bg-sky-400/80"></div>
        </div>
      </div>
    </div>

    <!-- 2. THREE.JS 3D SPATIAL RECONSTRUCTION VIEWPORT -->
    <div id="three-viewport" class="absolute inset-0 w-full h-full z-0 opacity-0 pointer-events-none transition-opacity duration-300">
      <div id="three-canvas-container" class="w-full h-full"></div>

      <!-- 3D Map Legend & Controls (Top Left) -->
      <div class="absolute top-32 left-3.5 z-20 pointer-events-none flex flex-col space-y-1.5">
        <span class="text-[10px] font-medium text-slate-200 bg-black/75 px-3 py-1 rounded-full backdrop-blur-md border border-white/10 w-max">
          <i class="fa-solid fa-hand-pointer text-sky-400 mr-1"></i> ドラッグで回転 / 2本指ズーム (1マス=5m)
        </span>
        <div class="flex items-center space-x-2 text-[9px] bg-black/70 px-2.5 py-1 rounded-full border border-white/10 w-max">
          <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-sky-400 inline-block"></span>開始</span>
          <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-rose-500 inline-block"></span>現在地</span>
          <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-400 inline-block"></span>傾きリング</span>
        </div>
      </div>
    </div>

    <!-- 3. DEDICATED 2D TOP-DOWN ORTHOMOSAIC VIEWER & PNG EXPORT VIEWPORT -->
    <div id="ortho-2d-viewport" class="absolute inset-0 w-full h-full z-0 opacity-0 pointer-events-none transition-opacity duration-300 bg-slate-950 flex flex-col pt-28 pb-48 px-3.5">
      <div class="glass-panel flex-1 rounded-3xl border border-sky-400/35 p-3 flex flex-col justify-between shadow-2xl overflow-hidden">
        <!-- Top Info & Regenerate Button -->
        <div class="flex items-center justify-between gap-2 pb-2 border-b border-white/10 shrink-0">
          <div class="min-w-0">
            <div class="text-xs font-bold text-white flex items-center gap-1.5">
              <i class="fa-solid fa-satellite text-sky-400"></i> 真上オルソ2Dマップ (1200×1200)
            </div>
            <div id="ortho-status-desc" class="text-[10px] text-slate-300 font-mono truncate">
              キーフレームから真上視点を再構成します
            </div>
          </div>
          <button id="btn-rebuild-ortho" class="px-3 py-1.5 rounded-xl bg-indigo-500/30 hover:bg-indigo-500/45 border border-indigo-400/50 text-indigo-100 text-[11px] font-bold flex items-center gap-1 shrink-0 active:scale-95 transition">
            <i class="fa-solid fa-arrows-rotate"></i> オルソ再生成
          </button>
        </div>

        <!-- High-Resolution 2D Orthomosaic Canvas Preview -->
        <div class="relative flex-1 my-2 bg-slate-900/90 rounded-2xl border border-white/10 overflow-hidden flex items-center justify-center">
          <canvas id="export-map-canvas" width="1200" height="1200" class="max-w-full max-h-full aspect-square object-contain"></canvas>
          <div id="ortho-rendering-badge" class="hidden absolute inset-0 bg-black/65 backdrop-blur-sm flex flex-col items-center justify-center text-sky-300 gap-2">
            <i class="fa-solid fa-spinner fa-spin text-2xl"></i>
            <span class="text-xs font-bold">真上オルソ画像を生成中...</span>
          </div>
        </div>

        <!-- Layer Toggles & Save PNG Action -->
        <div class="space-y-2 shrink-0">
          <div class="grid grid-cols-3 gap-1.5 text-[11px]">
            <label class="glass-card py-1.5 px-2 rounded-xl flex items-center justify-between cursor-pointer">
              <span class="text-slate-200 font-semibold">オルソ写真</span>
              <input id="chk-export-photo" type="checkbox" checked class="w-4 h-4 accent-emerald-400 rounded">
            </label>
            <label class="glass-card py-1.5 px-2 rounded-xl flex items-center justify-between cursor-pointer">
              <span class="text-slate-200 font-semibold">3D点群</span>
              <input id="chk-export-points" type="checkbox" checked class="w-4 h-4 accent-sky-400 rounded">
            </label>
            <label class="glass-card py-1.5 px-2 rounded-xl flex items-center justify-between cursor-pointer">
              <span class="text-slate-200 font-semibold">移動軌跡</span>
              <input id="chk-export-traj" type="checkbox" checked class="w-4 h-4 accent-fuchsia-400 rounded">
            </label>
          </div>

          <button id="btn-download-map-png" class="w-full py-2.5 rounded-2xl bg-sky-500 hover:bg-sky-400 text-white font-bold text-xs shadow-lg shadow-sky-500/30 active:scale-98 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-download"></i> 2Dオルソマップ画像を保存 (PNG)
          </button>
        </div>
      </div>
    </div>

    <!-- TAPPABLE PICTURE-IN-PICTURE (PiP) WINDOW (Shown in Camera & 3D Map modes) -->
    <div id="pip-window" class="pip-container absolute top-32 right-3.5 z-30 cursor-pointer glass-panel flex flex-col items-center justify-center">
      <div id="pip-content" class="relative w-full h-full overflow-hidden flex items-center justify-center"></div>
      <span id="pip-label" class="absolute bottom-1.5 left-1.5 right-1.5 text-center z-40 px-1.5 py-0.5 rounded-md text-[9px] font-bold bg-black/80 text-sky-300 border border-sky-400/30 pointer-events-none">
        3Dマップ
      </span>
    </div>

  </main>

  <!-- BOTTOM CURRENT LOCATION & TILT TELEMETRY CARD -->
  <section class="absolute bottom-20 left-3.5 right-3.5 z-30 pointer-events-none">
    <div class="glass-panel p-2.5 rounded-3xl pointer-events-auto shadow-2xl border border-white/15 space-y-2">

      <div class="flex items-center justify-between px-1">
        <span class="text-[11px] font-bold text-sky-300 flex items-center gap-1.5">
          <i class="fa-solid fa-location-crosshairs"></i> 現在地 (開始地点基準)
        </span>
        <span class="text-[11px] text-slate-300 font-mono">
          移動距離: <strong id="stat-dist" class="text-white">0.00m</strong>
        </span>
      </div>

      <!-- X, Y, Z Coordinates -->
      <div class="grid grid-cols-3 gap-1.5 text-center font-mono">
        <div class="glass-card py-1.5 px-1 rounded-2xl">
          <div class="text-[9px] font-semibold text-slate-400">X (左右)</div>
          <div id="pos-x" class="text-sm font-extrabold text-sky-300">0.00<span class="text-[9px] font-normal text-slate-400 ml-0.5">m</span></div>
        </div>
        <div class="glass-card py-1.5 px-1 rounded-2xl">
          <div class="text-[9px] font-semibold text-slate-400">Y (上下)</div>
          <div id="pos-y" class="text-sm font-extrabold text-emerald-300">0.00<span class="text-[9px] font-normal text-slate-400 ml-0.5">m</span></div>
        </div>
        <div class="glass-card py-1.5 px-1 rounded-2xl">
          <div class="text-[9px] font-semibold text-slate-400">Z (前後)</div>
          <div id="pos-z" class="text-sm font-extrabold text-purple-300">0.00<span class="text-[9px] font-normal text-slate-400 ml-0.5">m</span></div>
        </div>
      </div>

      <!-- Yaw, Pitch, Roll Readout -->
      <div class="grid grid-cols-3 gap-1.5 text-center font-mono text-[10px] text-slate-200">
        <div class="bg-slate-900/75 py-0.5 rounded-xl border border-white/5">方位: <span id="ori-yaw" class="font-bold text-fuchsia-300">0.0°</span></div>
        <div class="bg-slate-900/75 py-0.5 rounded-xl border border-white/5">上下: <span id="ori-pitch" class="font-bold text-amber-300">0.0°</span></div>
        <div class="bg-slate-900/75 py-0.5 rounded-xl border border-white/5">左右: <span id="ori-roll" class="font-bold text-cyan-300">0.0°</span></div>
      </div>

    </div>
  </section>

  <!-- STREAMLINED 3-BUTTON BOTTOM ACTION DOCK -->
  <footer class="absolute bottom-0 left-0 right-0 z-40 pb-5 pt-2.5 px-3.5 glass-panel border-t-0 rounded-t-3xl grid grid-cols-3 gap-2 shadow-2xl">
    <!-- 1. Start Camera & Gyro -->
    <button id="btn-start-cam" class="py-2.5 px-2 rounded-2xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-400/50 flex items-center justify-center space-x-1.5 text-emerald-200 active:scale-95 transition">
      <i class="fa-solid fa-video text-xs text-emerald-400"></i>
      <span id="label-cam-btn" class="text-xs font-bold">カメラ起動</span>
    </button>

    <!-- 2. Reset Origin -->
    <button id="btn-reset-origin" class="py-2.5 px-2 rounded-2xl glass-button flex items-center justify-center space-x-1.5 text-rose-200 active:scale-95 transition">
      <i class="fa-solid fa-rotate-left text-xs text-rose-400"></i>
      <span class="text-xs font-bold">原点リセット</span>
    </button>

    <!-- 3. Switch to 2D Ortho Map & Generate -->
    <button id="btn-open-map-export" class="py-2.5 px-2 rounded-2xl bg-sky-500/25 hover:bg-sky-500/35 border border-sky-400/50 flex items-center justify-center space-x-1.5 text-sky-100 active:scale-95 transition">
      <i class="fa-solid fa-map text-xs text-sky-300"></i>
      <span class="text-xs font-bold">2Dオルソ表示</span>
    </button>
  </footer>

  <!-- Offscreen Processing Canvas -->
  <canvas id="proc-canvas" class="hidden"></canvas>

  <script>
    /**
     * GPS-less Visual SLAM 3-Mode Current Location & Top-Down Orthomosaic Map App
     * Modes: 'camera' | '3d' | '2d'
     * Version: v2026.11.12-1803
     */
    const APP_BUILD_VERSION = "v2026.11.12-1803";

    // Pinhole Camera Intrinsics (iPhone Rear Wide ~68 deg horizontal FOV)
    const PROC_WIDTH = 240;
    const PROC_HEIGHT = 180;
    const H_FOV_DEG = 68.0;
    const FOCAL_PX = (PROC_WIDTH * 0.5) / Math.tan((H_FOV_DEG * 0.5 * Math.PI) / 180.0);
    const CX = PROC_WIDTH * 0.5;
    const CY = PROC_HEIGHT * 0.5;

    // Outdoor Spatial Range Constants
    const OUTDOOR_MAX_DEPTH = 35.0;
    const OUTDOOR_INITIAL_PRIOR = 4.5;
    const MAX_MAP_POINTS = 8000;

    // Captured Keyframes for On-Demand Nadir-Weighted Top-Down Orthomosaic Reconstruction
    const ORTHO_KF_W = 160;
    const ORTHO_KF_H = 120;
    const ORTHO_FOCAL_PX = (ORTHO_KF_W * 0.5) / Math.tan((H_FOV_DEG * 0.5 * Math.PI) / 180.0);
    const MAX_ORTHO_KEYFRAMES = 90;

    const kfCaptureCanvas = document.createElement('canvas');
    kfCaptureCanvas.width = ORTHO_KF_W;
    kfCaptureCanvas.height = ORTHO_KF_H;
    const kfCaptureCtx = kfCaptureCanvas.getContext('2d', { willReadFrequently: true });

    const state = {
      isCameraReady: false,
      isTracking: false,
      viewMode: 'camera', // 'camera' | '3d' | '2d'
      hasSensorPermission: false,
      lastFrameTime: performance.now(),

      // Current Camera Pose in Right-Handed Y-up World (+X: Right, +Y: Up, -Z: Forward)
      pose: {
        x: 0, y: 0, z: 0,
        pitch: 0, yaw: 0, roll: 0
      },
      // 3D Avatar Quaternion Orientation (Gimbal-lock-free tilt representation)
      avatarQuaternion: new THREE.Quaternion(),
      yawCalibrationQuat: null,

      lastPose: { x: 0, y: 0, z: 0 },
      lastOrthoCapturePose: { x: 999, z: 999, yaw: 999 },
      lastOrthoCaptureTime: 0,
      totalDistance: 0,
      reprojectionRMSE: 0,
      keyframeCount: 0,
      lastKeyframePose: { x: 0, y: 0, z: 0, yaw: 0, pitch: 0 },

      // Gyroscope Orientation Tracking
      sensor: {
        initAlpha: null, initBeta: null, initGamma: null
      },

      // Active 2D-3D Tracked Color-Edge Features & Persistent World Anchors
      activeAnchors: [],
      nextAnchorId: 1,

      // Triangulated Persistent 3D Point Cloud Landmarks
      triangulatedMapPoints: [],
      trajectory3D: [],

      // Stored Keyframe Snapshots for Top-Down 2D Orthomosaic Reconstruction
      // Each: { camPos: THREE.Vector3, invRotMat: THREE.Matrix4, forwardDir: THREE.Vector3, rgba: Uint8ClampedArray }
      orthoKeyframes: [],

      // Visualization Settings
      pointSize: 0.14
    };

    // --- DOM References ---
    const videoElem = document.getElementById('camera-feed');
    const trackingCanvas = document.getElementById('tracking-canvas');
    const trackingCtx = trackingCanvas.getContext('2d');
    const procCanvas = document.getElementById('proc-canvas');
    const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });

    const cameraViewport = document.getElementById('camera-viewport');
    const threeViewport = document.getElementById('three-viewport');
    const ortho2DViewport = document.getElementById('ortho-2d-viewport');
    const pipWindow = document.getElementById('pip-window');
    const pipContent = document.getElementById('pip-content');
    const pipLabel = document.getElementById('pip-label');
    const threeCanvasContainer = document.getElementById('three-canvas-container');

    const statusIndicator = document.getElementById('status-indicator');
    const statusText = document.getElementById('status-text');

    const segBtnCamera = document.getElementById('seg-btn-camera');
    const segBtn3D = document.getElementById('seg-btn-3d');
    const segBtn2D = document.getElementById('seg-btn-2d');

    const camStatFeatures = document.getElementById('cam-stat-features');
    const camStat3D = document.getElementById('cam-stat-3d');
    const camStatKf = document.getElementById('cam-stat-kf');

    const posXElem = document.getElementById('pos-x');
    const posYElem = document.getElementById('pos-y');
    const posZElem = document.getElementById('pos-z');
    const statDistElem = document.getElementById('stat-dist');
    const yawElem = document.getElementById('ori-yaw');
    const pitchElem = document.getElementById('ori-pitch');
    const rollElem = document.getElementById('ori-roll');

    const btnStartCam = document.getElementById('btn-start-cam');
    const labelCamBtn = document.getElementById('label-cam-btn');
    const btnResetOrigin = document.getElementById('btn-reset-origin');
    const btnOpenMapExport = document.getElementById('btn-open-map-export');

    // 2D Orthomosaic View Elements
    const exportMapCanvas = document.getElementById('export-map-canvas');
    const exportMapCtx = exportMapCanvas.getContext('2d');
    const orthoStatusDesc = document.getElementById('ortho-status-desc');
    const orthoRenderingBadge = document.getElementById('ortho-rendering-badge');
    const btnRebuildOrtho = document.getElementById('btn-rebuild-ortho');
    const chkExportPhoto = document.getElementById('chk-export-photo');
    const chkExportPoints = document.getElementById('chk-export-points');
    const chkExportTraj = document.getElementById('chk-export-traj');
    const btnDownloadMapPng = document.getElementById('btn-download-map-png');

    let prevGrayFrame = null;

    // --- Three.js Scene Objects ---
    let scene, camera3D, renderer3D;
    let trajectoryMeshGroup, pillarsGroup;
    let startMarkerMesh, currentMarkerMesh;
    let pointCloudParticles, pointCloudGeometry;
    let cameraAvatarGroup, levelHorizonRingMesh;

    // 3D Orbit Camera Parameters
    let is3DTouchDragging = false, previousTouchX = 0, previousTouchY = 0;
    let initialPinchDist = 0;
    let orbitAzimuth = 0.25, orbitElevation = 0.58, orbitDistance = 5.5;

    // ==========================================
    // 1. INITIALIZATION & CAMERA STREAMING
    // ==========================================
    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('app-build-ver').textContent = APP_BUILD_VERSION;
      procCanvas.width = PROC_WIDTH;
      procCanvas.height = PROC_HEIGHT;

      initThreeJS();
      resizeCanvases();
      window.addEventListener('resize', resizeCanvases);

      setupEventListeners();
      updateViewportLayout();

      await startCameraAndSensors();
      requestAnimationFrame(mainLoop);
    });

    function resizeCanvases() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      trackingCanvas.width = width;
      trackingCanvas.height = height;

      if (renderer3D && camera3D) {
        const containerW = threeCanvasContainer.clientWidth || width;
        const containerH = threeCanvasContainer.clientHeight || height;
        renderer3D.setSize(containerW, containerH);
        camera3D.aspect = containerW / containerH;
        camera3D.updateProjectionMatrix();
      }
    }

    async function startCameraAndSensors() {
      setStatus('カメラ・センサー起動中...', 'bg-amber-500');
      await requestSensorPermissions();

      try {
        if (!videoElem.srcObject) {
          const constraints = {
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            },
            audio: false
          };

          let stream;
          try {
            stream = await navigator.mediaDevices.getUserMedia(constraints);
          } catch (e) {
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          }

          videoElem.srcObject = stream;
        }

        await videoElem.play();
        state.isCameraReady = true;
        state.isTracking = true;
        labelCamBtn.textContent = "稼働中";
        setStatus('色エッジ特徴トラッキング中', 'bg-emerald-500');
      } catch (err) {
        console.warn("Camera gesture required:", err);
        setStatus('「カメラ起動」をタップ', 'bg-amber-500');
      }
    }

    function ensureVideoPlaying() {
      if (videoElem && videoElem.srcObject && videoElem.paused) {
        videoElem.play().catch(() => {});
      }
    }

    function setStatus(text, colorClass) {

      // 3-Mode Segmented Switcher

      btnRebuildOrtho.addEventListener('click', triggerOrthomosaicReconstruction);

      chkExportTraj.addEventListener('change', triggerOrthomosaicReconstruction);
      btnDownloadMapPng.addEventListener('click', download2DMapPNG);

      window.addEventListener('deviceorientation', handleOrientation, true);
      document.body.addEventListener('touchstart', ensureVideoPlaying, { passive: true });

      // 3D Map Viewport Touch Orbit & Pinch Zoom
      threeViewport.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          is3DTouchDragging = true;
          previousTouchX = e.touches[0].clientX;
          previousTouchY = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
          is3DTouchDragging = false;
          initialPinchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      }, { passive: true });

      threeViewport.addEventListener('touchmove', (e) => {
        if (is3DTouchDragging && e.touches.length === 1) {
          const dx = e.touches[0].clientX - previousTouchX;
          const dy = e.touches[0].clientY - previousTouchY;
          orbitAzimuth -= dx * 0.008;
          orbitElevation = Math.max(0.10, Math.min(1.55, orbitElevation + dy * 0.008));
          previousTouchX = e.touches[0].clientX;
          previousTouchY = e.touches[0].clientY;
        } else if (e.touches.length === 2 && initialPinchDist > 0) {
          const curDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const scale = initialPinchDist / Math.max(10, curDist);
          orbitDistance = Math.max(1.5, Math.min(55.0, orbitDistance * scale));
          initialPinchDist = curDist;
        }
      }, { passive: true });

      threeViewport.addEventListener('touchend', () => {
        is3DTouchDragging = false;
        initialPinchDist = 0;
      });
    }

    async function requestSensorPermissions() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res === 'granted') state.hasSensorPermission = true;
        } catch (err) {
          console.warn("Gyro permission skipped:", err);
        }
      } else {
        state.hasSensorPermission = true;
      }
    }

    /**
     * W3C DeviceOrientation (alpha, beta, gamma) -> Three.js Y-up Quaternion
     */
    function computeDeviceQuaternion(alphaDeg, betaDeg, gammaDeg) {
      const alpha = THREE.MathUtils.degToRad(alphaDeg);
      const beta = THREE.MathUtils.degToRad(betaDeg);
      const gamma = THREE.MathUtils.degToRad(gammaDeg);

      const screenAngle = (window.screen && window.screen.orientation && typeof window.screen.orientation.angle === 'number')
        ? window.screen.orientation.angle
        : (typeof window.orientation === 'number' ? window.orientation : 0);
      const orient = THREE.MathUtils.degToRad(screenAngle);

      const zee = new THREE.Vector3(0, 0, 1);
      const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
      const q = new THREE.Quaternion().setFromEuler(euler);
      const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
      const q0 = new THREE.Quaternion().setFromAxisAngle(zee, -orient);

      q.multiply(q1);
      q.multiply(q0);
      return q;
    }

    function handleOrientation(e) {
      if (e.alpha === null) return;
      if (state.sensor.initAlpha === null) {
        state.sensor.initAlpha = e.alpha;
        state.sensor.initBeta = e.beta;
        state.sensor.initGamma = e.gamma;
      }

      // 1. Keep exact Euler calculation for PnP Solver compatibility
      let yaw = e.alpha - state.sensor.initAlpha;
      if (yaw > 180) yaw -= 360;
      if (yaw < -180) yaw += 360;

      state.pose.yaw = yaw;
      state.pose.pitch = e.beta - state.sensor.initBeta;
      state.pose.roll = -(e.gamma - state.sensor.initGamma);

      // 2. Compute true 3D Quaternion for the 3D Map Device Avatar & Orthomosaic Camera Pose
      const rawQuat = computeDeviceQuaternion(e.alpha, e.beta, e.gamma);
      if (state.yawCalibrationQuat === null) {
        const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(rawQuat);
        const initHeading = Math.atan2(-fwd.x, -fwd.z);
        state.yawCalibrationQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -initHeading);
      }
      state.avatarQuaternion.copy(state.yawCalibrationQuat).multiply(rawQuat);

      const tiltEuler = new THREE.Euler().setFromQuaternion(state.avatarQuaternion, 'YXZ');
      yawElem.textContent = `${THREE.MathUtils.radToDeg(tiltEuler.y).toFixed(1)}°`;
      pitchElem.textContent = `${THREE.MathUtils.radToDeg(tiltEuler.x).toFixed(1)}°`;
      rollElem.textContent = `${THREE.MathUtils.radToDeg(tiltEuler.z).toFixed(1)}°`;
    }

    function setViewMode(mode) {

    // ==========================================
    // 3. KEYFRAME CAPTURE FOR NADIR-WEIGHTED 2D ORTHOMOSAIC
    // ==========================================
    function maybeCaptureOrthoKeyframe(now) {
      if (!videoElem || videoElem.readyState < 2) return;

      const tiltEuler = new THREE.Euler().setFromQuaternion(state.avatarQuaternion, 'YXZ');
      const heading = tiltEuler.y;
      const pitch = tiltEuler.x;

      // Skip capturing if camera is pointing up into the sky (pitch > +12 deg)
      if (pitch > 0.21) return;

      const movedDist = Math.hypot(
        state.pose.x - state.lastOrthoCapturePose.x,
        state.pose.z - state.lastOrthoCapturePose.z
      );
      const turnedDeg = Math.abs(THREE.MathUtils.radToDeg(heading - state.lastOrthoCapturePose.yaw));

      // Capture a keyframe whenever moving >= 0.35m or turning >= 12 deg (or initial frame)
      if (state.orthoKeyframes.length > 0 && movedDist < 0.35 && turnedDeg < 12.0 && (now - state.lastOrthoCaptureTime) < 2500) {
        return;
      }

      state.lastOrthoCapturePose = { x: state.pose.x, z: state.pose.z, yaw: heading };
      state.lastOrthoCaptureTime = now;

      kfCaptureCtx.drawImage(videoElem, 0, 0, ORTHO_KF_W, ORTHO_KF_H);
      const imgData = kfCaptureCtx.getImageData(0, 0, ORTHO_KF_W, ORTHO_KF_H);

      // Camera World Position (assuming handheld height ~1.35m above ground plane Y=0)
      const camPos = new THREE.Vector3(state.pose.x, Math.max(0.75, 1.35 + state.pose.y), state.pose.z);
      const rotMat = new THREE.Matrix4().makeRotationFromQuaternion(state.avatarQuaternion);
      const invRotMat = rotMat.clone().invert();
      const forwardDir = new THREE.Vector3(0, 0, -1).applyQuaternion(state.avatarQuaternion).normalize();

      // Compute Nadir Alignment Score: 1.0 when camera looks straight down (0, -1, 0), lower when oblique
      const nadirCos = Math.max(0.15, -forwardDir.y);

      state.orthoKeyframes.push({
        camPos,
        invRotMat,
        forwardDir,
        nadirCos,
        rgba: imgData.data
      });

      if (state.orthoKeyframes.length > MAX_ORTHO_KEYFRAMES) {
        // Retain frames with better nadir view or evenly spaced coverage
        state.orthoKeyframes.shift();
      }
    }

    // ==========================================
    // 4. OUTDOOR MAP-TO-FRAME PNP SLAM (RGB COLOR-EDGE FEATURES)
    // ==========================================
    function mainLoop() {
      const now = performance.now();
      const dt = Math.min(0.1, (now - state.lastFrameTime) / 1000);
      state.lastFrameTime = now;

      if (state.isTracking && videoElem.readyState >= 2) {
        procCtx.drawImage(videoElem, 0, 0, PROC_WIDTH, PROC_HEIGHT);
        const frameData = procCtx.getImageData(0, 0, PROC_WIDTH, PROC_HEIGHT);
        runPnPVisualSLAM(frameData, dt);
        maybeCaptureOrthoKeyframe(now);
      }

      render2DCameraFeaturesOverlay();
      if (state.viewMode === '3d') {
        update3DScene();
      }
      requestAnimationFrame(mainLoop);
    }

    /**
     * Multi-Channel RGB Color-Edge Shi-Tomasi Corner Detector with Grid-NMS
     * Computes structure tensor across all 3 RGB color channels (dR, dG, dB) plus chrominance
     * contrast so boundaries between differently colored objects are strongly prioritized.
     */
    function extractColorEdgeCorners(data, maxCorners = 54) {
      const corners = [];
      const rows = 5;
      const cols = 6;
      const cellW = Math.floor(PROC_WIDTH / cols);
      const cellH = Math.floor(PROC_HEIGHT / rows);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let bestScore = -Infinity;
          let bestCorner = null;

          const x0 = c * cellW + 8;
          const x1 = (c + 1) * cellW - 8;
          const y0 = r * cellH + 8;
          const y1 = (r + 1) * cellH - 8;

          for (let y = y0; y < y1; y += 3) {
            for (let x = x0; x < x1; x += 3) {
              let Ixx = 0, Iyy = 0, Ixy = 0;
              let colorDiffSum = 0;

              for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                  const idxL = ((y + dy) * PROC_WIDTH + (x + dx - 1)) * 4;
                  const idxR = ((y + dy) * PROC_WIDTH + (x + dx + 1)) * 4;
                  const idxU = ((y + dy - 1) * PROC_WIDTH + (x + dx)) * 4;
                  const idxD = ((y + dy + 1) * PROC_WIDTH + (x + dx)) * 4;

                  // Multi-channel RGB spatial gradients (Di Zenzo color structure tensor)
                  const gxR = (data[idxR] - data[idxL]) * 0.5;
                  const gxG = (data[idxR + 1] - data[idxL + 1]) * 0.5;
                  const gxB = (data[idxR + 2] - data[idxL + 2]) * 0.5;

                  const gyR = (data[idxD] - data[idxU]) * 0.5;
                  const gyG = (data[idxD + 1] - data[idxU + 1]) * 0.5;
                  const gyB = (data[idxD + 2] - data[idxU + 2]) * 0.5;

                  Ixx += gxR * gxR + gxG * gxG + gxB * gxB;
                  Iyy += gyR * gyR + gyG * gyG + gyB * gyB;
                  Ixy += gxR * gyR + gxG * gyG + gxB * gyB;

                  // Chromaticity difference boost (R-G and B-G color contrast across edge)
                  const dRG_x = (data[idxR] - data[idxR + 1]) - (data[idxL] - data[idxL + 1]);
                  const dBG_x = (data[idxR + 2] - data[idxR + 1]) - (data[idxL + 2] - data[idxL + 1]);
                  const dRG_y = (data[idxD] - data[idxD + 1]) - (data[idxU] - data[idxU + 1]);
                  const dBG_y = (data[idxD + 2] - data[idxD + 1]) - (data[idxU] - data[idxU + 1]);
                  colorDiffSum += Math.hypot(dRG_x, dBG_x, dRG_y, dBG_y);
                }
              }

              const trace = Ixx + Iyy;
              const detTerm = Math.sqrt(Math.max(0, (Ixx - Iyy) * (Ixx - Iyy) + 4 * Ixy * Ixy));
              const lambdaMin = (trace - detTerm) * 0.5;

              // Combine RGB corner strength with chromatic color-boundary weight
              const colorEdgeScore = lambdaMin * (1.0 + Math.min(2.5, colorDiffSum / 260.0));

              if (lambdaMin > 420 && colorEdgeScore > bestScore) {
                const cIdx = (y * PROC_WIDTH + x) * 4;
                bestScore = colorEdgeScore;
                bestCorner = {
                  u: x,
                  v: y,
                  score: colorEdgeScore,
                  r: data[cIdx] / 255.0,
                  g: data[cIdx + 1] / 255.0,
                  b: data[cIdx + 2] / 255.0
                };
              }
            }
          }
          if (bestCorner) corners.push(bestCorner);
        }
      }
      return corners.sort((a, b) => b.score - a.score).slice(0, maxCorners);
    }

    function getCameraRotationMatrix(pose) {
      const euler = new THREE.Euler(
        THREE.MathUtils.degToRad(pose.pitch),
        THREE.MathUtils.degToRad(pose.yaw),
        THREE.MathUtils.degToRad(pose.roll),
        'YXZ'
      );
      return new THREE.Matrix4().makeRotationFromEuler(euler);
    }

    function projectWorldToPixel(worldPt, camPos, invRotMat) {
      const rel = new THREE.Vector3().subVectors(worldPt, camPos).applyMatrix4(invRotMat);
      const depth = -rel.z;
      if (depth < 0.2) return null;

      const u = CX + FOCAL_PX * (rel.x / depth);
      const v = CY - FOCAL_PX * (rel.y / depth);
      return { u, v, depth };
    }

    function pixelToWorldRay(u, v, rotMat) {
      const rayCam = new THREE.Vector3(
        (u - CX) / FOCAL_PX,
        -(v - CY) / FOCAL_PX,
        -1.0
      ).normalize();
      return rayCam.applyMatrix4(rotMat).normalize();
    }

    function triangulateStereoRays(orig0, ray0, orig1, ray1) {
      const w0 = new THREE.Vector3().subVectors(orig0, orig1);
      const b = ray0.dot(ray1);
      const d = ray0.dot(w0);
      const e = ray1.dot(w0);

      const denom = 1.0 - b * b;
      if (denom < 0.0019) return null;

      const s = (b * e - d) / denom;
      const t = (e - b * d) / denom;

      if (s < 0.4 || s > OUTDOOR_MAX_DEPTH || t < 0.4 || t > OUTDOOR_MAX_DEPTH) return null;

      const p0 = new THREE.Vector3().copy(orig0).addScaledVector(ray0, s);
      const p1 = new THREE.Vector3().copy(orig1).addScaledVector(ray1, t);

      const maxErr = Math.max(0.08, s * 0.025);
      if (p0.distanceTo(p1) > maxErr) return null;

      return new THREE.Vector3().addVectors(p0, p1).multiplyScalar(0.5);
    }

    function solvePnPTranslationGaussNewton(anchors, initialCamPos, rotMat, invRotMat) {
      if (anchors.length < 4) return null;

      const camPos = initialCamPos.clone();
      const maxIters = 6;
      const huberDelta = 12.0;

      for (let iter = 0; iter < maxIters; iter++) {
        let H00 = 1e-3, H01 = 0, H02 = 0;
        let H11 = 1e-3, H12 = 0;
        let H22 = 1e-3;
        let g0 = 0, g1 = 0, g2 = 0;
        let inlierCount = 0;

        for (let i = 0; i < anchors.length; i++) {
          const a = anchors[i];
          const rel = new THREE.Vector3().subVectors(a.worldPos, camPos).applyMatrix4(invRotMat);
          const Z = -rel.z;
          if (Z < 0.3 || Z > OUTDOOR_MAX_DEPTH + 5.0) continue;

          const uPred = CX + FOCAL_PX * (rel.x / Z);
          const vPred = CY - FOCAL_PX * (rel.y / Z);

          const errU = a.u - uPred;
          const errV = a.v - vPred;
          const errNorm = Math.hypot(errU, errV);

          const weight = errNorm <= huberDelta ? 1.0 : (huberDelta / errNorm);

          const invZ = 1.0 / Z;
          const invZ2 = invZ * invZ;

          const ju_xc = -FOCAL_PX * invZ;
          const ju_yc = 0;
          const ju_zc = -FOCAL_PX * rel.x * invZ2;

          const jv_xc = 0;
          const jv_yc = FOCAL_PX * invZ;
          const jv_zc = FOCAL_PX * rel.y * invZ2;

          const e = rotMat.elements;
          const Ju0 = ju_xc * e[0] + ju_yc * e[4] + ju_zc * e[8];
          const Ju1 = ju_xc * e[1] + ju_yc * e[5] + ju_zc * e[9];
          const Ju2 = ju_xc * e[2] + ju_yc * e[6] + ju_zc * e[10];

          const Jv0 = jv_xc * e[0] + jv_yc * e[4] + jv_zc * e[8];
          const Jv1 = jv_xc * e[1] + jv_yc * e[5] + jv_zc * e[9];
          const Jv2 = jv_xc * e[2] + jv_yc * e[6] + jv_zc * e[10];

          H00 += weight * (Ju0 * Ju0 + Jv0 * Jv0);
          H01 += weight * (Ju0 * Ju1 + Jv0 * Jv1);
          H02 += weight * (Ju0 * Ju2 + Jv0 * Jv2);
          H11 += weight * (Ju1 * Ju1 + Jv1 * Jv1);
          H12 += weight * (Ju1 * Ju2 + Jv1 * Jv2);
          H22 += weight * (Ju2 * Ju2 + Jv2 * Jv2);

          g0 += weight * (Ju0 * errU + Jv0 * errV);
          g1 += weight * (Ju1 * errU + Jv1 * errV);
          g2 += weight * (Ju2 * errU + Jv2 * errV);
          inlierCount++;
        }

        if (inlierCount < 4) return null;

        const det =
          H00 * (H11 * H22 - H12 * H12) -
          H01 * (H01 * H22 - H12 * H02) +
          H02 * (H01 * H12 - H11 * H02);

        if (Math.abs(det) < 1e-8) break;

        const invDet = 1.0 / det;
        const dx = invDet * (
          g0 * (H11 * H22 - H12 * H12) -
          H01 * (g1 * H22 - H12 * g2) +
          H02 * (g1 * H12 - H11 * g2)
        );
        const dy = invDet * (
          H00 * (g1 * H22 - H12 * g2) -
          g0 * (H01 * H22 - H12 * H02) +
          H02 * (H01 * g2 - g1 * H02)
        );
        const dz = invDet * (
          H00 * (H11 * g2 - g1 * H12) -
          H01 * (H01 * g2 - g1 * H02) +
          g0 * (H01 * H12 - H11 * H02)
        );

        const stepNorm = Math.hypot(dx, dy, dz);
        const maxStep = 0.45;
        const scale = stepNorm > maxStep ? (maxStep / stepNorm) : 1.0;

        camPos.x += dx * scale;
        camPos.y += dy * scale;
        camPos.z += dz * scale;

        if (stepNorm < 1e-4) break;
      }

      let sumSqErr = 0;
      let validCount = 0;
      for (let a of anchors) {
        const proj = projectWorldToPixel(a.worldPos, camPos, invRotMat);
        if (proj) {
          a.projU = proj.u;
          a.projV = proj.v;
          a.residualPx = Math.hypot(a.u - proj.u, a.v - proj.v);
          sumSqErr += a.residualPx * a.residualPx;
          validCount++;
        }
      }

      const rmse = validCount > 0 ? Math.sqrt(sumSqErr / validCount) : 99.9;
      return { camPos, rmse, validCount };
    }

    function runPnPVisualSLAM(frameData, dt) {
      const data = frameData.data;

      const curGray = new Uint8Array(PROC_WIDTH * PROC_HEIGHT);
      for (let i = 0, p = 0; i < data.length; i += 4, p++) {
        curGray[p] = (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) | 0;
      }

      const rotMat = getCameraRotationMatrix(state.pose);
      const invRotMat = rotMat.clone().invert();
      const currentCamOrigin = new THREE.Vector3(state.pose.x, state.pose.y, state.pose.z);

      const survivingAnchors = [];
      if (prevGrayFrame) {
        for (let anchor of state.activeAnchors) {
          const pred = projectWorldToPixel(anchor.worldPos, currentCamOrigin, invRotMat);
          const searchCenterU = pred ? Math.round(0.6 * anchor.u + 0.4 * pred.u) : Math.round(anchor.u);
          const searchCenterV = pred ? Math.round(0.6 * anchor.v + 0.4 * pred.v) : Math.round(anchor.v);

          if (searchCenterU < 8 || searchCenterU >= PROC_WIDTH - 8 || searchCenterV < 8 || searchCenterV >= PROC_HEIGHT - 8) {
            continue;
          }

          const origU = Math.round(anchor.u);
          const origV = Math.round(anchor.v);
          if (origU < 6 || origU >= PROC_WIDTH - 6 || origV < 6 || origV >= PROC_HEIGHT - 6) continue;

          let bestU = searchCenterU;
          let bestV = searchCenterV;
          let bestSAD = Infinity;

          for (let sv = -6; sv <= 6; sv += 1) {
            const candV = searchCenterV + sv;
            if (candV < 5 || candV >= PROC_HEIGHT - 5) continue;

            for (let su = -6; su <= 6; su += 1) {
              const candU = searchCenterU + su;
              if (candU < 5 || candU >= PROC_WIDTH - 5) continue;

              let sad = 0;
              for (let py = -2; py <= 2; py++) {
                const rowPrev = (origV + py) * PROC_WIDTH + origU;
                const rowCur = (candV + py) * PROC_WIDTH + candU;
                for (let px = -2; px <= 2; px++) {
                  sad += Math.abs(prevGrayFrame[rowPrev + px] - curGray[rowCur + px]);
                }
              }
              if (sad < bestSAD) {
                bestSAD = sad;
                bestU = candU;
                bestV = candV;
              }
            }
          }

          if (bestSAD / 25.0 < 22.0) {
            anchor.u = bestU;
            anchor.v = bestV;
            anchor.age++;
            anchor.trail.push({ u: bestU, v: bestV });
            if (anchor.trail.length > 8) anchor.trail.shift();

            const cIdx = (bestV * PROC_WIDTH + bestU) * 4;
            anchor.color = {
              r: data[cIdx] / 255.0,
              g: data[cIdx + 1] / 255.0,
              b: data[cIdx + 2] / 255.0
            };
            survivingAnchors.push(anchor);
          }
        }
      }

      state.activeAnchors = survivingAnchors;

      if (state.activeAnchors.length >= 5) {
        const pnpResult = solvePnPTranslationGaussNewton(state.activeAnchors, currentCamOrigin, rotMat, invRotMat);
        if (pnpResult && pnpResult.rmse < 24.0) {
          const jumpDist = pnpResult.camPos.distanceTo(currentCamOrigin);
          if (jumpDist < 0.85) {
            state.pose.x = state.pose.x * 0.25 + pnpResult.camPos.x * 0.75;
            state.pose.y = state.pose.y * 0.25 + pnpResult.camPos.y * 0.75;
            state.pose.z = state.pose.z * 0.25 + pnpResult.camPos.z * 0.75;
            state.reprojectionRMSE = pnpResult.rmse;
            setStatus(`現在地更新中 (${state.triangulatedMapPoints.length}点)`, 'bg-emerald-500');
          }
        } else {
          setStatus('色エッジ特徴を再探索中...', 'bg-amber-500');
        }
      } else {
        setStatus('色エッジ特徴点をスキャン中...', 'bg-sky-500');
      }

      const updatedCamOrigin = new THREE.Vector3(state.pose.x, state.pose.y, state.pose.z);

      for (let anchor of state.activeAnchors) {
        const baseline = anchor.birthOrigin.distanceTo(updatedCamOrigin);
        if (!anchor.isTriangulated && baseline >= 0.15 && anchor.age >= 4) {
          const curRay = pixelToWorldRay(anchor.u, anchor.v, rotMat);
          const parallaxAngle = anchor.birthRay.angleTo(curRay);

          if (parallaxAngle >= (2.5 * Math.PI) / 180.0) {
            const triPt = triangulateStereoRays(anchor.birthOrigin, anchor.birthRay, updatedCamOrigin, curRay);
            if (triPt) {
              anchor.worldPos.copy(triPt);
              anchor.isTriangulated = true;

              const isDup = state.triangulatedMapPoints.some(p => p.position.distanceTo(triPt) < 0.12);
              if (!isDup && state.triangulatedMapPoints.length < MAX_MAP_POINTS) {
                state.triangulatedMapPoints.push({
                  position: triPt.clone(),
                  color: { ...anchor.color }
                });
              }
            }
          }
        }
      }

      const movedFromKF = Math.hypot(
        state.pose.x - state.lastKeyframePose.x,
        state.pose.y - state.lastKeyframePose.y,
        state.pose.z - state.lastKeyframePose.z
      );
      const rotatedFromKF = Math.abs(state.pose.yaw - state.lastKeyframePose.yaw) + Math.abs(state.pose.pitch - state.lastKeyframePose.pitch);

      if (state.activeAnchors.length < 24 || movedFromKF > 0.45 || rotatedFromKF > 18.0) {
        const freshCorners = extractColorEdgeCorners(data, 48);
        let added = 0;

        for (let c of freshCorners) {
          const tooClose = state.activeAnchors.some(a => Math.hypot(a.u - c.u, a.v - c.v) < 14);
          if (tooClose) continue;

          const worldRay = pixelToWorldRay(c.u, c.v, rotMat);

          let matchedExisting3D = null;
          let bestRayDist = 0.25;
          for (let mp of state.triangulatedMapPoints) {
            const toPt = new THREE.Vector3().subVectors(mp.position, updatedCamOrigin);
            const projLen = toPt.dot(worldRay);
            if (projLen > 0.4 && projLen < OUTDOOR_MAX_DEPTH) {
              const perpDist = toPt.sub(worldRay.clone().multiplyScalar(projLen)).length();
              if (perpDist < bestRayDist) {
                bestRayDist = perpDist;
                matchedExisting3D = mp.position.clone();
              }
            }
          }

          const initialWorldPos = matchedExisting3D
            ? matchedExisting3D
            : updatedCamOrigin.clone().addScaledVector(worldRay, OUTDOOR_INITIAL_PRIOR);

          state.activeAnchors.push({
            id: state.nextAnchorId++,
            u: c.u,
            v: c.v,
            trail: [{ u: c.u, v: c.v }],
            worldPos: initialWorldPos,
            birthOrigin: updatedCamOrigin.clone(),
            birthRay: worldRay,
            isTriangulated: !!matchedExisting3D,
            projU: c.u,
            projV: c.v,
            residualPx: 0,
            color: { r: c.r, g: c.g, b: c.b },
            age: 0
          });
          added++;
          if (state.activeAnchors.length >= 46) break;
        }

        if (added > 0) {
          state.keyframeCount++;
          state.lastKeyframePose = {
            x: state.pose.x,
            y: state.pose.y,
            z: state.pose.z,
            yaw: state.pose.yaw,
            pitch: state.pose.pitch
          };
        }
      }

      const stepDist = Math.hypot(
        state.pose.x - state.lastPose.x,
        state.pose.y - state.lastPose.y,
        state.pose.z - state.lastPose.z
      );
      if (stepDist > 0.003 && stepDist < 1.0) {
        state.totalDistance += stepDist;
      }
      state.lastPose = { x: state.pose.x, y: state.pose.y, z: state.pose.z };

      if (
        state.trajectory3D.length === 0 ||
        Math.hypot(
          state.pose.x - state.trajectory3D[state.trajectory3D.length - 1].x,
          state.pose.y - state.trajectory3D[state.trajectory3D.length - 1].y,
          state.pose.z - state.trajectory3D[state.trajectory3D.length - 1].z
        ) > 0.05
      ) {
        state.trajectory3D.push({
          x: state.pose.x,
          y: state.pose.y,
          z: state.pose.z,
          timestamp: performance.now()
        });
      }

      // Update Telemetry UI
      posXElem.innerHTML = `${state.pose.x.toFixed(2)}<span class="text-[9px] font-normal text-slate-400 ml-0.5">m</span>`;
      posYElem.innerHTML = `${state.pose.y.toFixed(2)}<span class="text-[9px] font-normal text-slate-400 ml-0.5">m</span>`;
      posZElem.innerHTML = `${state.pose.z.toFixed(2)}<span class="text-[9px] font-normal text-slate-400 ml-0.5">m</span>`;
      statDistElem.textContent = `${state.totalDistance.toFixed(2)}m`;

      prevGrayFrame = curGray;
    }

    // ==========================================
    // 5. CAMERA MODE COLOR-EDGE FEATURE OVERLAY
    // ==========================================
    function render2DCameraFeaturesOverlay() {
      const width = trackingCanvas.width;
      const height = trackingCanvas.height;
      trackingCtx.clearRect(0, 0, width, height);

      let triCount = 0;
      for (let a of state.activeAnchors) {
        if (a.isTriangulated) triCount++;
      }
      if (camStatFeatures) camStatFeatures.textContent = state.activeAnchors.length;
      if (camStat3D) camStat3D.textContent = triCount;
      if (camStatKf) camStatKf.textContent = state.orthoKeyframes.length;

      if (state.viewMode !== 'camera') return;

      const scaleX = width / PROC_WIDTH;
      const scaleY = height / PROC_HEIGHT;

      for (let a of state.activeAnchors) {
        const obsX = a.u * scaleX;
        const obsY = a.v * scaleY;
        const projX = a.projU * scaleX;
        const projY = a.projV * scaleY;

        // 1. Optical Flow Motion Trail
        if (a.trail && a.trail.length > 1) {
          trackingCtx.beginPath();
          for (let i = 0; i < a.trail.length; i++) {
            const tx = a.trail[i].u * scaleX;
            const ty = a.trail[i].v * scaleY;
            if (i === 0) trackingCtx.moveTo(tx, ty);
            else trackingCtx.lineTo(tx, ty);
          }
          trackingCtx.strokeStyle = 'rgba(56, 189, 248, 0.65)';
          trackingCtx.lineWidth = 2.0;
          trackingCtx.stroke();
        }

        // 2. PnP Reprojection Residual Vector
        trackingCtx.beginPath();
        trackingCtx.moveTo(obsX, obsY);
        trackingCtx.lineTo(projX, projY);
        trackingCtx.strokeStyle = a.residualPx < 4.5 ? '#facc15' : '#fb7185';
        trackingCtx.lineWidth = 1.5;
        trackingCtx.stroke();

        // 3. Color-Edge Keypoint Marker
        trackingCtx.beginPath();
        trackingCtx.arc(obsX, obsY, a.isTriangulated ? 5.5 : 4.2, 0, Math.PI * 2);
        trackingCtx.fillStyle = a.isTriangulated ? '#10b981' : '#22d3ee';
        trackingCtx.fill();
        trackingCtx.lineWidth = 1.5;
        trackingCtx.strokeStyle = '#ffffff';
        trackingCtx.stroke();
      }
    }

    // ==========================================
    // 6. THREE.JS 3D SPATIAL RENDERER (3D MAP MODE)
    // ==========================================
    function initThreeJS() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050811);

      camera3D = new THREE.PerspectiveCamera(60, width / height, 0.1, 250);
      camera3D.position.set(0, 3.5, 5.5);

      renderer3D = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer3D.setSize(width, height);
      renderer3D.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      threeCanvasContainer.appendChild(renderer3D.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.95));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
      dirLight.position.set(10, 25, 15);
      scene.add(dirLight);

      // 100m x 100m Outdoor Metric Grid (1 cell = 5.0m)
      const grid = new THREE.GridHelper(100, 20, 0x38bdf8, 0x1e293b);
      grid.position.y = -1.20;
      scene.add(grid);

      trajectoryMeshGroup = new THREE.Group();
      scene.add(trajectoryMeshGroup);

      pillarsGroup = new THREE.Group();
      scene.add(pillarsGroup);

      startMarkerMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.18, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7 })
      );
      scene.add(startMarkerMesh);

      currentMarkerMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.15, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xf43f5e, emissive: 0xe11d48 })
      );
      scene.add(currentMarkerMesh);

      // World-Level Horizon Reference Ring
      const horizonGeo = new THREE.RingGeometry(0.46, 0.49, 48);
      horizonGeo.rotateX(-Math.PI / 2);
      levelHorizonRingMesh = new THREE.Mesh(
        horizonGeo,
        new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.5 })
      );
      scene.add(levelHorizonRingMesh);

      // Smartphone 3D Pose Avatar + Frustum + Heading Arrow + Gold Attitude Ring
      cameraAvatarGroup = new THREE.Group();

      const phoneBody = new THREE.Mesh(
        new THREE.BoxGeometry(0.28, 0.56, 0.035),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.7, roughness: 0.25 })
      );
      cameraAvatarGroup.add(phoneBody);

      const phoneScreen = new THREE.Mesh(
        new THREE.PlaneGeometry(0.25, 0.50),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide })
      );
      phoneScreen.position.z = 0.02;
      cameraAvatarGroup.add(phoneScreen);

      const attitudeGeo = new THREE.RingGeometry(0.41, 0.45, 48);
      attitudeGeo.rotateX(-Math.PI / 2);
      const attitudeMesh = new THREE.Mesh(
        attitudeGeo,
        new THREE.MeshBasicMaterial({ color: 0xfbbf24, side: THREE.DoubleSide, transparent: true, opacity: 0.92 })
      );
      cameraAvatarGroup.add(attitudeMesh);

      const frustumGeo = new THREE.ConeGeometry(0.60, 0.85, 4);
      frustumGeo.rotateX(-Math.PI / 2);
      const frustumMesh = new THREE.Mesh(
        frustumGeo,
        new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.7 })
      );
      frustumMesh.position.z = -0.42;
      cameraAvatarGroup.add(frustumMesh);

      const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, -1), new THREE.Vector3(0, 0, 0), 0.95, 0x10b981, 0.22, 0.14);
      cameraAvatarGroup.add(arrow);

      scene.add(cameraAvatarGroup);

      pointCloudGeometry = new THREE.BufferGeometry();
      const pointMat = new THREE.PointsMaterial({
        vertexColors: true,
        size: state.pointSize,
        transparent: true,
        opacity: 0.95,
        sizeAttenuation: true
      });
      pointCloudParticles = new THREE.Points(pointCloudGeometry, pointMat);
      scene.add(pointCloudParticles);
    }

    function update3DScene() {
      if (!scene || !renderer3D) return;

      cameraAvatarGroup.position.set(state.pose.x, state.pose.y, state.pose.z);
      cameraAvatarGroup.quaternion.copy(state.avatarQuaternion);

      if (levelHorizonRingMesh) {
        levelHorizonRingMesh.position.set(state.pose.x, state.pose.y, state.pose.z);
      }
      currentMarkerMesh.position.set(state.pose.x, state.pose.y, state.pose.z);

      if (state.trajectory3D.length > 1) {
        while (trajectoryMeshGroup.children.length > 0) {
          const obj = trajectoryMeshGroup.children.pop();
          if (obj.geometry) obj.geometry.dispose();
        }
        while (pillarsGroup.children.length > 0) {
          const obj = pillarsGroup.children.pop();
          if (obj.geometry) obj.geometry.dispose();
        }

        const pts = state.trajectory3D.map(p => new THREE.Vector3(p.x, p.y, p.z));
        startMarkerMesh.position.copy(pts[0]);

        const curve = new THREE.CatmullRomCurve3(pts);
        const segments = Math.min(pts.length * 3, 400);
        const tubeGeo = new THREE.TubeGeometry(curve, segments, 0.055, 8, false);

        const vCount = tubeGeo.attributes.position.count;
        const tubeColors = new Float32Array(vCount * 3);
        const cObj = new THREE.Color();

        for (let i = 0; i < vCount; i++) {
          const ratio = i / vCount;
          const hue = 0.55 - ratio * 0.45;
          cObj.setHSL(Math.max(0.0, hue), 0.9, 0.55);
          tubeColors[i * 3] = cObj.r;
          tubeColors[i * 3 + 1] = cObj.g;
          tubeColors[i * 3 + 2] = cObj.b;
        }
        tubeGeo.setAttribute('color', new THREE.BufferAttribute(tubeColors, 3));

        const tubeMesh = new THREE.Mesh(
          tubeGeo,
          new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.35 })
        );
        trajectoryMeshGroup.add(tubeMesh);

        const step = Math.max(1, Math.floor(pts.length / 30));
        for (let i = 0; i < pts.length; i += step) {
          const p = pts[i];
          const pGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(p.x, p.y, p.z),
            new THREE.Vector3(p.x, -1.2, p.z)
          ]);
          const line = new THREE.Line(
            pGeo,
            new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.28 })
          );
          pillarsGroup.add(line);
        }
      }

      const totalPts = state.triangulatedMapPoints.length + state.activeAnchors.length;
      if (totalPts > 0) {
        const positions = new Float32Array(totalPts * 3);
        const colors = new Float32Array(totalPts * 3);
        let idx = 0;

        for (let mp of state.triangulatedMapPoints) {
          positions[idx * 3] = mp.position.x;
          positions[idx * 3 + 1] = mp.position.y;
          positions[idx * 3 + 2] = mp.position.z;
          colors[idx * 3] = mp.color.r;
          colors[idx * 3 + 1] = mp.color.g;
          colors[idx * 3 + 2] = mp.color.b;
          idx++;
        }

        for (let a of state.activeAnchors) {
          positions[idx * 3] = a.worldPos.x;
          positions[idx * 3 + 1] = a.worldPos.y;
          positions[idx * 3 + 2] = a.worldPos.z;
          colors[idx * 3] = a.color.r;
          colors[idx * 3 + 1] = a.color.g;
          colors[idx * 3 + 2] = a.color.b;
          idx++;
        }

        pointCloudGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        pointCloudGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        pointCloudGeometry.attributes.position.needsUpdate = true;
        pointCloudGeometry.attributes.color.needsUpdate = true;
      }

      const tx = state.pose.x;
      const ty = state.pose.y;
      const tz = state.pose.z;

      const camX = tx + orbitDistance * Math.cos(orbitElevation) * Math.sin(orbitAzimuth);
      const camY = ty + orbitDistance * Math.sin(orbitElevation);
      const camZ = tz + orbitDistance * Math.cos(orbitElevation) * Math.cos(orbitAzimuth);

      camera3D.position.set(camX, camY, camZ);
      camera3D.lookAt(tx, ty, tz);

      renderer3D.render(scene, camera3D);
    }

    // ==========================================
    // 7. ON-DEMAND NADIR-WEIGHTED 2D ORTHOMOSAIC RECONSTRUCTION
    // ==========================================
    function triggerOrthomosaicReconstruction() {
      orthoRenderingBadge.classList.remove('hidden');
      // Yield 1 frame so spinner renders smoothly before inverse ray-casting
      requestAnimationFrame(() => {
        setTimeout(() => {
          reconstructTopDownOrthomosaic();
          orthoRenderingBadge.classList.add('hidden');
        }, 20);
      });
    }

    /**
     * Reconstructs a true top-down (bird's-eye) 2D Orthomosaic image by inverse ray-casting
     * every ground pixel (X, Z, Y=0) back into captured keyframe cameras, weighting pixels
     * viewed closest to vertical (nadir) and closest to optical center to eliminate distortion.
     */
    function reconstructTopDownOrthomosaic() {
      const W = exportMapCanvas.width;   // 1200
      const H = exportMapCanvas.height;  // 1200
      const ctx = exportMapCtx;

      // 1. Dark Map Paper Base
      ctx.fillStyle = '#070d19';
      ctx.fillRect(0, 0, W, H);

      // 2. Compute World Bounding Box (X, Z) from trajectory, keypoints & keyframe footprints
      let minX = Math.min(-2.0, state.pose.x - 2.0);
      let maxX = Math.max(2.0, state.pose.x + 2.0);
      let minZ = Math.min(-2.0, state.pose.z - 2.0);
      let maxZ = Math.max(2.0, state.pose.z + 2.0);

      state.trajectory3D.forEach(p => {
        if (p.x - 2.5 < minX) minX = p.x - 2.5;
        if (p.x + 2.5 > maxX) maxX = p.x + 2.5;
        if (p.z - 2.5 < minZ) minZ = p.z - 2.5;
        if (p.z + 2.5 > maxZ) maxZ = p.z + 2.5;
      });

      state.orthoKeyframes.forEach(kf => {
        if (kf.camPos.x - 3.5 < minX) minX = kf.camPos.x - 3.5;
        if (kf.camPos.x + 3.5 > maxX) maxX = kf.camPos.x + 3.5;
        if (kf.camPos.z - 3.5 < minZ) minZ = kf.camPos.z - 3.5;
        if (kf.camPos.z + 3.5 > maxZ) maxZ = kf.camPos.z + 3.5;
      });

      if (chkExportPoints.checked) {
        state.triangulatedMapPoints.forEach(mp => {
          if (mp.position.x < minX) minX = mp.position.x;
          if (mp.position.x > maxX) maxX = mp.position.x;
          if (mp.position.z < minZ) minZ = mp.position.z;
          if (mp.position.z > maxZ) maxZ = mp.position.z;
        });
      }

      const spanX = Math.max(5.0, maxX - minX);
      const spanZ = Math.max(5.0, maxZ - minZ);
      const maxSpan = Math.max(spanX, spanZ) * 1.15;
      const centerX = (minX + maxX) * 0.5;
      const centerZ = (minZ + maxZ) * 0.5;

      const mapTop = 104;
      const mapBottom = H - 104;
      const mapHeightPx = mapBottom - mapTop;
      const mapLeft = 48;
      const mapRight = W - 48;
      const mapWidthPx = mapRight - mapLeft;

      const pxPerMeter = Math.min(mapWidthPx, mapHeightPx) / maxSpan;
      const worldToMapX = (wx) => (W * 0.5) + (wx - centerX) * pxPerMeter;
      const worldToMapY = (wz) => (H * 0.5) + (wz - centerZ) * pxPerMeter;

      // 3. Inverse Ray-to-Ground-Plane Nadir-Weighted Orthomosaic Synthesis
      const kfs = state.orthoKeyframes;
      if (chkExportPhoto.checked && kfs.length > 0) {
        // Render at 480x480 orthomosaic grid and upscale cleanly into map viewport
        const ORTHO_GRID = 480;
        const orthoImg = ctx.createImageData(ORTHO_GRID, ORTHO_GRID);
        const out = orthoImg.data;

        const halfKF_W = ORTHO_KF_W * 0.5;
        const halfKF_H = ORTHO_KF_H * 0.5;
        const relVec = new THREE.Vector3();

        for (let gy = 0; gy < ORTHO_GRID; gy++) {
          const mapY = mapTop + ((gy + 0.5) / ORTHO_GRID) * mapHeightPx;
          const wz = centerZ + (mapY - H * 0.5) / pxPerMeter;

          for (let gx = 0; gx < ORTHO_GRID; gx++) {
            const mapX = mapLeft + ((gx + 0.5) / ORTHO_GRID) * mapWidthPx;
            const wx = centerX + (mapX - W * 0.5) / pxPerMeter;

            let sumR = 0, sumG = 0, sumB = 0, sumW = 0;

            for (let k = 0; k < kfs.length; k++) {
              const kf = kfs[k];
              const dx = wx - kf.camPos.x;
              const dy = 0.0 - kf.camPos.y; // Ground plane Y = 0
              const dz = wz - kf.camPos.z;

              const distSq = dx * dx + dy * dy + dz * dz;
              if (distSq > 64.0) continue; // Ignore ground pixels > 8m away from camera

              relVec.set(dx, dy, dz).applyMatrix4(kf.invRotMat);
              const depth = -relVec.z;
              if (depth < 0.35 || depth > 8.0) continue;

              const u = halfKF_W + ORTHO_FOCAL_PX * (relVec.x / depth);
              const v = halfKF_H - ORTHO_FOCAL_PX * (relVec.y / depth);

              if (u < 2 || u >= ORTHO_KF_W - 2 || v < 2 || v >= ORTHO_KF_H - 2) continue;

              // Center-of-lens radial weight (suppresses lens edge distortion)
              const normU = (u - halfKF_W) / halfKF_W;
              const normV = (v - halfKF_H) / halfKF_H;
              const radialSq = normU * normU + normV * normV;
              if (radialSq > 0.95) continue;

              // Nadir (top-down vertical) priority weight: favors rays pointing straight down
              const invDist = 1.0 / Math.sqrt(distSq);
              const rayDownCos = Math.max(0.05, -dy * invDist);
              const weight = (1.0 - radialSq * 0.85) * (rayDownCos * rayDownCos * kf.nadirCos) * invDist;

              // Bilinear texture sample
              const u0 = u | 0;
              const v0 = v | 0;
              const fu = u - u0;
              const fv = v - v0;
              const w00 = (1 - fu) * (1 - fv);
              const w10 = fu * (1 - fv);
              const w01 = (1 - fu) * fv;
              const w11 = fu * fv;

              const i00 = (v0 * ORTHO_KF_W + u0) * 4;
              const i10 = i00 + 4;
              const i01 = i00 + ORTHO_KF_W * 4;
              const i11 = i01 + 4;

              const r = kf.rgba[i00] * w00 + kf.rgba[i10] * w10 + kf.rgba[i01] * w01 + kf.rgba[i11] * w11;
              const g = kf.rgba[i00 + 1] * w00 + kf.rgba[i10 + 1] * w10 + kf.rgba[i01 + 1] * w01 + kf.rgba[i11 + 1] * w11;
              const b = kf.rgba[i00 + 2] * w00 + kf.rgba[i10 + 2] * w10 + kf.rgba[i01 + 2] * w01 + kf.rgba[i11 + 2] * w11;

              sumR += r * weight;
              sumG += g * weight;
              sumB += b * weight;
              sumW += weight;
            }

            const pIdx = (gy * ORTHO_GRID + gx) * 4;
            if (sumW > 0.0001) {
              out[pIdx] = (sumR / sumW) | 0;
              out[pIdx + 1] = (sumG / sumW) | 0;
              out[pIdx + 2] = (sumB / sumW) | 0;
              out[pIdx + 3] = 255;
            } else {
              out[pIdx] = 7;
              out[pIdx + 1] = 13;
              out[pIdx + 2] = 25;
              out[pIdx + 3] = 255;
            }
          }
        }

        const tempOrthoCanvas = document.createElement('canvas');
        tempOrthoCanvas.width = ORTHO_GRID;
        tempOrthoCanvas.height = ORTHO_GRID;
        tempOrthoCanvas.getContext('2d').putImageData(orthoImg, 0, 0);

        ctx.save();
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(tempOrthoCanvas, mapLeft, mapTop, mapWidthPx, mapHeightPx);
        ctx.restore();
      }

      // 4. Metric Coordinate Grid Overlay
      const niceSteps = [1, 2, 5, 10, 20, 50];
      let gridStepMeters = niceSteps[0];
      for (let s of niceSteps) {
        if (s * pxPerMeter >= 90) {
          gridStepMeters = s;
          break;
        }
      }

      const gridStepPx = gridStepMeters * pxPerMeter;
      const originMapX = worldToMapX(0);
      const originMapY = worldToMapY(0);

      ctx.strokeStyle = 'rgba(56, 189, 248, 0.24)';
      ctx.lineWidth = 1.5;

      for (let gx = originMapX % gridStepPx; gx < W; gx += gridStepPx) {
        if (gx >= mapLeft && gx <= mapRight) {
          ctx.beginPath(); ctx.moveTo(gx, mapTop); ctx.lineTo(gx, mapBottom); ctx.stroke();
        }
      }
      for (let gy = originMapY % gridStepPx; gy < H; gy += gridStepPx) {
        if (gy >= mapTop && gy <= mapBottom) {
          ctx.beginPath(); ctx.moveTo(mapLeft, gy); ctx.lineTo(mapRight, gy); ctx.stroke();
        }
      }

      // Origin Axes
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.55)';
      ctx.lineWidth = 2.5;
      if (originMapX >= mapLeft && originMapX <= mapRight) {
        ctx.beginPath(); ctx.moveTo(originMapX, mapTop); ctx.lineTo(originMapX, mapBottom); ctx.stroke();
      }
      if (originMapY >= mapTop && originMapY <= mapBottom) {
        ctx.beginPath(); ctx.moveTo(mapLeft, originMapY); ctx.lineTo(mapRight, originMapY); ctx.stroke();
      }

      // 5. Plot Scanned 3D RGB Color-Edge Point Cloud Landmarks
      if (chkExportPoints.checked && state.triangulatedMapPoints.length > 0) {
        const ptRadius = Math.max(3, Math.min(7.5, pxPerMeter * 0.07));
        for (let mp of state.triangulatedMapPoints) {
          const mx = worldToMapX(mp.position.x);
          const my = worldToMapY(mp.position.z);
          if (mx < mapLeft || mx > mapRight || my < mapTop || my > mapBottom) continue;

          const r = Math.round(mp.color.r * 255);
          const g = Math.round(mp.color.g * 255);
          const b = Math.round(mp.color.b * 255);
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.94)`;
          ctx.beginPath();
          ctx.arc(mx, my, ptRadius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 6. Draw Trajectory Route Path
      if (chkExportTraj.checked && state.trajectory3D.length > 1) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 8;
        ctx.strokeStyle = '#38bdf8';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
        ctx.shadowBlur = 8;

        ctx.beginPath();
        state.trajectory3D.forEach((p, idx) => {
          const mx = worldToMapX(p.x);
          const my = worldToMapY(p.z);
          if (idx === 0) ctx.moveTo(mx, my);
          else ctx.lineTo(mx, my);
        });
        ctx.stroke();
        ctx.restore();
      }

      // 7. Start Pin (0, 0)
      ctx.fillStyle = '#0284c7';
      ctx.beginPath();
      ctx.arc(originMapX, originMapY, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText('START', originMapX + 22, originMapY + 8);

      // 8. Current Location Pin & Heading Cone
      const curMapX = worldToMapX(state.pose.x);
      const curMapY = worldToMapY(state.pose.z);

      const tiltEuler = new THREE.Euler().setFromQuaternion(state.avatarQuaternion, 'YXZ');
      const headingRad = tiltEuler.y;

      ctx.save();
      ctx.translate(curMapX, curMapY);
      ctx.rotate(-headingRad);

      ctx.fillStyle = 'rgba(244, 63, 94, 0.35)';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-34, -75);
      ctx.lineTo(34, -75);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = '#ffe4e6';
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText('NOW', curMapX + 24, curMapY + 8);

      // 9. Top Banner Header & Compass Rose
      ctx.fillStyle = 'rgba(15, 23, 42, 0.96)';
      ctx.fillRect(0, 0, W, 98);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, 98); ctx.lineTo(W, 98); ctx.stroke();

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 34px sans-serif';
      ctx.fillText('TOP-DOWN ORTHOMOSAIC 2D MAP', 44, 52);

      const dateStr = new Date().toLocaleString('ja-JP');
      ctx.fillStyle = '#94a3b8';
      ctx.font = '22px monospace';
      ctx.fillText(`${dateStr}  |  ${APP_BUILD_VERSION}  |  KF:${kfs.length}枚`, 44, 82);

      // Compass Badge
      ctx.save();
      ctx.translate(W - 68, 49);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(8, 4); ctx.lineTo(-8, 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('FWD', 0, 20);
      ctx.restore();

      // 10. Bottom Footer Metadata & Dynamic Metric Scale Bar
      ctx.fillStyle = 'rgba(15, 23, 42, 0.96)';
      ctx.fillRect(0, H - 98, W, 98);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
      ctx.beginPath(); ctx.moveTo(0, H - 98); ctx.lineTo(W, H - 98); ctx.stroke();

      ctx.textAlign = 'left';
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 26px monospace';
      ctx.fillText(
        `現在地: X=${state.pose.x.toFixed(2)}m  Z=${state.pose.z.toFixed(2)}m  Y=${state.pose.y.toFixed(2)}m`,
        44,
        H - 54
      );
      ctx.fillStyle = '#34d399';
      ctx.font = '22px monospace';
      ctx.fillText(
        `総移動距離: ${state.totalDistance.toFixed(2)}m  |  点群: ${state.triangulatedMapPoints.length}点`,
        44,
        H - 22
      );

      // Scale Bar
      const barRight = W - 48;
      const barLeft = barRight - gridStepPx;
      const barY = H - 36;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(barLeft, barY - 12);
      ctx.lineTo(barLeft, barY);
      ctx.lineTo(barRight, barY);
      ctx.lineTo(barRight, barY - 12);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`${gridStepMeters}.0 m`, (barLeft + barRight) * 0.5, barY - 18);
      ctx.textAlign = 'left';

      orthoStatusDesc.textContent = `オルソ生成完了 (キーフレーム ${kfs.length}枚合成 / 1マス ${gridStepMeters}m)`;
    }

    function download2DMapPNG() {
      reconstructTopDownOrthomosaic();
      const dataURL = exportMapCanvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.href = dataURL;
      const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
      link.download = `slam_ortho_2d_map_${stamp}.png`;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    // ==========================================
    // 8. ORIGIN RESET
    // ==========================================
    function resetOriginPosition() {
      state.pose = { x: 0, y: 0, z: 0, pitch: 0, yaw: 0, roll: 0 };
      state.lastPose = { x: 0, y: 0, z: 0 };
      state.sensor.initAlpha = null;
      state.yawCalibrationQuat = null;
      state.avatarQuaternion.identity();
      state.totalDistance = 0;
      state.reprojectionRMSE = 0;
      state.keyframeCount = 0;
      state.lastKeyframePose = { x: 0, y: 0, z: 0, yaw: 0, pitch: 0 };
      state.activeAnchors = [];
      state.triangulatedMapPoints = [];
      state.trajectory3D = [];
      state.orthoKeyframes = [];
      state.lastOrthoCapturePose = { x: 999, z: 999, yaw: 999 };
      prevGrayFrame = null;

      while (trajectoryMeshGroup.children.length > 0) {
        const obj = trajectoryMeshGroup.children.pop();
        if (obj.geometry) obj.geometry.dispose();
      }
      while (pillarsGroup.children.length > 0) {
        const obj = pillarsGroup.children.pop();
        if (obj.geometry) obj.geometry.dispose();
      }

      pointCloudGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(0), 3));
      pointCloudGeometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(0), 3));

      statDistElem.textContent = '0.00m';
      posXElem.innerHTML = `0.00<span class="text-[9px] font-normal text-slate-400 ml-0.5">m</span>`;
      posYElem.innerHTML = `0.00<span class="text-[9px] font-normal text-slate-400 ml-0.5">m</span>`;
      posZElem.innerHTML = `0.00<span class="text-[9px] font-normal text-slate-400 ml-0.5">m</span>`;

      if (state.viewMode === '2d') {
        triggerOrthomosaicReconstruction();
      }

      setStatus('開始地点(原点)をリセットしました', 'bg-sky-500');
    }
  </script>
